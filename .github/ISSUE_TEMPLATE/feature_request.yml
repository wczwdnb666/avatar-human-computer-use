name: 功能建议
description: 提议一个新功能或改进
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        提功能前请先看一眼 [README 的「当前能力边界」](../#当前能力边界如实列出)
        —— 有些东西是**刻意不做**的（比如硬解验证题）。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: |
        **先说问题，再说方案。** "我想要 X 功能"不是问题描述 ——
        "我在 Y 场景下做不到 Z"才是。
      placeholder: "我想让 Avatar 在多个窗口之间自动切换，但现在只能操作一个"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案
      description: 可以粗略，也可以具体到 API 设计。
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
      description: 有没有别的办法能达到目的？为什么不行？
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 只影响我自己的用法
        - 会影响现有 API（破坏性）
        - 会引入新依赖（**本项目零依赖，需要充分理由**）
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      description: |
        本项目有几条硬约束，提功能时请确认不冲突。
      options:
        - label: 这个功能**不需要**引入第三方依赖
          required: true
        - label: 这个功能**不涉及**硬解验证码 / 绕过风控
          required: true
        - label: 这个功能**不要求**绕过项目的风控闸（检出风险必须停下叫人）
          required: true
