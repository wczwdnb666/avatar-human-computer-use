name: CI

# 什么时候跑
on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]
  workflow_dispatch:        # 允许手动触发

# ★ workflow 级环境变量 —— 所有 step 自动继承。
#
#   Windows runner 的 Python stdout 默认编码是 **cp1252**，
#   打印 `✓` / `✗` 这类字符会直接抛 UnicodeEncodeError 把 CI 打红。
#   三步一起上：
#     PYTHONIOENCODING  —— 让 Python 的 stdio 用 UTF-8
#     PYTHONUTF8        —— 打开 UTF-8 模式（PEP 540，等价 -X utf8）
#     PYTHONUNBUFFERED  —— 不缓冲，日志实时可见（挂了能看到挂在哪）
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

# 同一分支的新提交取消旧任务 —— 省 CI 额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # 一个版本挂了不要让其他版本被取消 ——
      # 要看全貌才知道是"某个版本特有"还是"全挂"
      fail-fast: false

      matrix:
        os: [windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ★ 本项目**零第三方依赖** —— 不装任何包。
      #   这一条本身就是 CI 要验证的东西：如果哪天有人加了依赖，
      #   这里会因为 ImportError 红掉。
      - name: 验证零依赖
        shell: bash
        # ★ 这个 step 显式再声明一次编码环境变量。
        #   workflow 级已经有一份，这里重复是为了让本 step 的编码
        #   行为在日志里自洽 —— 它是最早跑 Python 的一步，
        #   也是历史上第一个被 cp1252 打挂的地方。
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          echo "=== 检查是否引入了第三方依赖 ==="
          python -c "
          import ast, pathlib, sys
          BANNED = {
              'requests','httpx','aiohttp','openai','anthropic','litellm',
              'PIL','cv2','numpy','pytesseract','paddleocr','easyocr',
              'win32com','comtypes','pywin32','clr','pydantic','anyio',
              'pytest','pytest_mock','pytest_asyncio','unittest_mock',
          }
          bad = []
          # 只扫 avatar/（2026-10-17 移除了独立外壳包）。
          files = list(pathlib.Path('avatar').rglob('*.py'))
          for p in files:
              tree = ast.parse(p.read_text(encoding='utf-8'))
              for n in ast.walk(tree):
                  names = []
                  if isinstance(n, ast.Import):
                      names = [(a.name or '').split('.')[0] for a in n.names]
                  elif isinstance(n, ast.ImportFrom) and n.level == 0:
                      names = [(n.module or '').split('.')[0]]
                  for nm in names:
                      if nm in BANNED:
                          bad.append('%s: %s' % (p, nm))
          if bad:
              print('[FAIL] 发现第三方依赖：')
              for b in bad[:20]:
                  print('  ' + b)
              sys.exit(1)
          print('[OK] 零第三方依赖（扫描 %d 个文件）' % len(files))
          "

      # ★ pytest 是**唯一的开发期依赖**。
      #
      #   「零依赖」指的是**运行期**：`dependencies = []`，装完即用。
      #   跑测试当然需要测试框架 —— 这里显式装，不藏着。
      #
      #   ⚠ 必须显式装：`actions/setup-python` 装出来的解释器**不带**
      #   pytest（runner 自带的那个 Python 才有）。少了这一步，
      #   后面所有 `python -m pytest` 都会以 "No module named pytest" 红掉。
      - name: 安装开发期依赖（只有 pytest）
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: 模块自检 + 硬约束
        shell: bash
        run: |
          python scripts/selfcheck.py

      - name: 全量测试
        shell: bash
        # ★ 失败即红（硬约束 5）
        run: |
          python -m pytest tests/ -q --no-header


  # ----------------------------------------------------------------
  # 一个汇总 job —— 分支保护只需要勾这一个
  # ----------------------------------------------------------------
  ci-ok:
    name: CI 通过
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: 检查所有矩阵任务
        shell: bash
        run: |
          # needs.test 的结果是矩阵的汇总：全成功才是 success
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "[FAIL] 测试矩阵未全部通过：${{ needs.test.result }}"
            exit 1
          fi
          echo "[OK] 全部通过"
